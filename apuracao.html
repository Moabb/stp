<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuração e Classificação - Novo Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; }
    .table-dark-custom { background-color: #1e293b; color: #fff; }
    .table-dark-custom th { background-color: #0f172a; color: #94a3b8; border-color: #334155; }
    .table-dark-custom td { border-color: #334155; vertical-align: middle; }
    .pos-1 { color: #facc15; font-weight: bold; } /* Ouro */
    .pos-2 { color: #94a3b8; font-weight: bold; } /* Prata */
    .pos-3 { color: #b45309; font-weight: bold; } /* Bronze */
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">PROVA DE LAÇO</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="config.html">Parâmetros</a>
        <a class="nav-link" href="cadastro.html">Inscrições/Trios</a>
        <a class="nav-link" href="admin.html">Mesa do Juiz</a>
        <a class="nav-link active" href="apuracao.html">Apuração</a>
        <a class="nav-link" href="telao.html" target="_blank">Telão (OBS)</a>
        <a class="nav-link" href="relatorios.html">Relatórios</a>
      </div>
      <button class="btn btn-outline-danger btn-sm" id="btn-sair">Sair</button>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Apuração de Resultados e Classificação</h2>
      <div class="d-flex gap-2">
        <button class="btn btn-warning fw-bold" id="btn-promover-semifinal">Classificar p/ Semifinal</button>
        <button class="btn btn-success fw-bold" id="btn-promover-final">Classificar p/ Final</button>
      </div>
    </div>

    <!-- Filtro de Fases -->
    <div class="card card-custom p-3 mb-4">
      <div class="row align-items-center">
        <div class="col-md-4">
          <label class="form-label text-muted">Filtrar por Fase:</label>
          <select id="filtro-fase" class="form-select bg-dark text-white border-secondary">
            <option value="todas">Todas as Fases / Geral</option>
            <option value="classificatoria">Classificatória</option>
            <option value="semifinal">Semifinal</option>
            <option value="final">Final</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Tabela de Classificação -->
    <div class="card card-custom p-3">
      <div class="table-responsive">
        <table class="table table-dark-custom align-middle">
          <thead>
            <tr>
              <th class="text-center">Pos.</th>
              <th>Senha</th>
              <th>Laçadores</th>
              <th>1ª Bateria</th>
              <th>2ª Bateria</th>
              <th>3ª Bateria</th>
              <th>Semifinal</th>
              <th>Final</th>
              <th class="text-end">Tempo Total</th>
            </tr>
          </thead>
          <tbody id="tabela-apuracao-body">
            <tr><td colspan="9" class="text-center text-muted">Calculando resultados...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, doc, getDoc, updateDoc, checarAutenticacao, signOut, auth } from "./firebase-config.js";

    await checarAutenticacao();

    let triosLista = [];
    let configGeral = {};

    // Carregar parâmetros para saber limites de vagas nas fases
    async function carregarParametros() {
      const snap = await getDoc(doc(db, "parametros", "config_geral"));
      if (snap.exists()) {
        configGeral = snap.data();
      }
    }

    function formatarTempoExibicao(val) {
      if (!val) return "-";
      if (val >= 990) return "<span class='text-danger fw-bold'>SAT/NULO</span>";
      return val.toFixed(3) + "s";
    }

    function calcularEExibirResultados() {
      const faseFiltro = document.getElementById("filtro-fase").value;
      const tbody = document.getElementById("tabela-apuracao-body");
      tbody.innerHTML = "";

      let listaFiltrada = triosLista.filter(trio => {
        if (faseFiltro === "todas") return true;
        return trio.faseAtual === faseFiltro;
      });

      // Algoritmo de Ordenação/Classificação por menor tempo total
      listaFiltrada.sort((a, b) => {
        const totalA = somarTempos(a);
        const totalB = somarTempos(b);
        return totalA - totalB;
      });

      if (listaFiltrada.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">Nenhum resultado encontrado nesta fase.</td></tr>`;
        return;
      }

      listaFiltrada.forEach((trio, idx) => {
        const pos = idx + 1;
        let classePos = "";
        if (pos === 1) classePos = "pos-1";
        else if (pos === 2) classePos = "pos-2";
        else if (pos === 3) classePos = "pos-3";

        const t1 = trio.tempos?.bateria_1;
        const t2 = trio.tempos?.bateria_2;
        const t3 = trio.tempos?.bateria_3;
        const tSemi = trio.tempos?.bateria_semifinal;
        const tFinal = trio.tempos?.bateria_final;

        const total = somarTempos(trio);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="text-center ${classePos}">${pos}º</td>
          <td class="fw-bold text-warning">#${trio.senha}</td>
          <td>
            <strong>${trio.lacador1}</strong> / <strong>${trio.lacador2}</strong>
            ${trio.lacador3 ? ` / ${trio.lacador3}` : ''}
          </td>
          <td>${formatarTempoExibicao(t1)}</td>
          <td>${formatarTempoExibicao(t2)}</td>
          <td>${formatarTempoExibicao(t3)}</td>
          <td>${formatarTempoExibicao(tSemi)}</td>
          <td>${formatarTempoExibicao(tFinal)}</td>
          <td class="text-end fw-bold fs-5 text-success">${total >= 990 ? 'DESCLASSIFICADO' : total.toFixed(3) + 's'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function somarTempos(trio) {
      if (!trio.tempos) return 9999;
      let soma = 0;
      let desclassificado = false;

      Object.values(trio.tempos).forEach(val => {
        if (val >= 990) desclassificado = true;
        soma += val;
      });

      return desclassificado ? 9999 : soma;
    }

    // Promover automáticos
    document.getElementById("btn-promover-semifinal").addEventListener("click", async () => {
      const limite = configGeral.limiteSemifinal || 20;
      if (!confirm(`Deseja promover os ${limite} melhores para a Semifinal?`)) return;

      const classificados = [...triosLista]
        .sort((a, b) => somarTempos(a) - somarTempos(b))
        .slice(0, limite);

      for (const trio of classificados) {
        if (somarTempos(trio) < 990) {
          await updateDoc(doc(db, "trios", trio.id), { faseAtual: "semifinal" });
        }
      }
      alert(`Promovidos ${classificados.length} trios para a Semifinal!`);
    });

    document.getElementById("btn-promover-final").addEventListener("click", async () => {
      const limite = configGeral.limiteFinal || 10;
      if (!confirm(`Deseja promover os ${limite} melhores para a Final?`)) return;

      const classificados = [...triosLista]
        .filter(t => t.faseAtual === "semifinal")
        .sort((a, b) => somarTempos(a) - somarTempos(b))
        .slice(0, limite);

      for (const trio of classificados) {
        if (somarTempos(trio) < 990) {
          await updateDoc(doc(db, "trios", trio.id), { faseAtual: "final" });
        }
      }
      alert(`Promovidos ${classificados.length} trios para a Final!`);
    });

    document.getElementById("filtro-fase").addEventListener("change", calcularEExibirResultados);

    // Escutar atualizações no Firestore
    onSnapshot(collection(db, "trios"), (snapshot) => {
      triosLista = [];
      snapshot.forEach(docSnap => {
        triosLista.push({ id: docSnap.id, ...docSnap.data() });
      });
      calcularEExibirResultados();
    });

    document.getElementById("btn-sair").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });

    carregarParametros();
  </script>
</body>
</html>
