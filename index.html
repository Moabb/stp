<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Prova de Laço - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card-login {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }
    .btn-primary {
      background-color: #2563eb;
      border: none;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card card-login p-4">
    <div class="text-center mb-4">
      <h3 class="fw-bold">Gestão de Laço</h3>
      <p class="text-muted small">Acesse o sistema para gerenciar as provas</p>
    </div>

    <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>

    <form id="form-login">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control bg-dark text-white border-secondary" id="email" required placeholder="admin@laco.com">
      </div>
      <div class="mb-4">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control bg-dark text-white border-secondary" id="senha" required placeholder="******">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btn-entrar">
        Entrar no Sistema
      </button>
    </form>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, checarAutenticacao } from "./firebase-config.js";

    // Se já estiver logado, vai direto para as configurações/painel
    checarAutenticacao(false).then(user => {
      if (user) window.location.href = "config.html";
    });

    const form = document.getElementById("form-login");
    const alertError = document.getElementById("alert-error");
    const btnEntrar = document.getElementById("btn-entrar");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertError.classList.add("d-none");
      btnEntrar.disabled = true;
      btnEntrar.innerText = "Autenticando...";

      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        window.location.href = "config.html";
      } catch (error) {
        btnEntrar.disabled = false;
        btnEntrar.innerText = "Entrar no Sistema";
        alertError.classList.remove("d-none");
        
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          alertError.innerText = "E-mail ou senha incorretos.";
        } else {
          alertError.innerText = "Erro ao fazer login: " + error.message;
        }
      }
    });
  </script>
</body>
</html>
