<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios e Folhas de Pista - Novo Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; }
    
    /* Estilos específicos para Impressão / PDF */
    @media print {
      body { background-color: #fff !important; color: #000 !important; }
      .navbar, .btn, .no-print { display: none !important; }
      .card-custom { border: none !important; background-color: #fff !important; }
      .table { color: #000 !important; border-color: #000 !important; }
      .table th, .table td { border-color: #000 !important; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">PROVA DE LAÇO</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="config.html">Parâmetros</a>
        <a class="nav-link" href="cadastro.html">Inscrições/Trios</a>
        <a class="nav-link" href="admin.html">Mesa do Juiz</a>
        <a class="nav-link" href="apuracao.html">Apuração</a>
        <a class="nav-link" href="telao.html" target="_blank">Telão (OBS)</a>
        <a class="nav-link active" href="relatorios.html">Relatórios</a>
      </div>
      <button class="btn btn-outline-danger btn-sm" id="btn-sair">Sair</button>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
      <h2>Relatórios e Folha de Pista</h2>
      <button class="btn btn-primary fw-bold" onclick="window.print()">Imprimir / Gerar PDF</button>
    </div>

    <!-- Filtro de Relatório -->
    <div class="card card-custom p-3 mb-4 no-print">
      <div class="row">
        <div class="col-md-6">
          <label class="form-label">Tipo de Relatório</label>
          <select id="tipo-relatorio" class="form-select bg-dark text-white border-secondary">
            <option value="folha_pista">Folha de Pista para Juízes (Ordem de Entrada)</option>
            <option value="financeiro">Financeiro / Inscrições Pagas e Pendentes</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Área de Impressão -->
    <div class="card card-custom p-4" id="area-impressao">
      <div class="text-center mb-4 border-bottom pb-3">
        <h3 class="fw-bold" id="titulo-relatorio">Folha de Pista - Prova de Laço</h3>
        <p class="text-muted m-0" id="subtitulo-data">Gerado em: --/--/----</p>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered align-middle" id="tabela-relatorio">
          <thead class="table-dark">
            <tr id="cabecalho-tabela">
              <!-- Dinâmico -->
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- Dinâmico -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, collection, getDocs, checarAutenticacao, signOut, auth, query, orderBy } from "./firebase-config.js";

    await checarAutenticacao();

    const selectTipo = document.getElementById("tipo-relatorio");
    const cabecalho = document.getElementById("cabecalho-tabela");
    const corpo = document.getElementById("corpo-tabela");
    const titulo = document.getElementById("titulo-relatorio");
    const subtitulo = document.getElementById("subtitulo-data");

    subtitulo.innerText = `Gerado em: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}`;

    async function gerarRelatorio() {
      const tipo = selectTipo.value;
      const snapshot = await getDocs(query(collection(db, "trios"), orderBy("senha", "asc")));
      
      corpo.innerHTML = "";

      if (tipo === "folha_pista") {
        titulo.innerText = "Folha de Pista - Anotações do Juiz";
        cabecalho.innerHTML = `
          <th style="width: 80px;">Senha</th>
          <th>Laçadores / Integrantes</th>
          <th style="width: 120px;">1ª Passada</th>
          <th style="width: 120px;">2ª Passada</th>
          <th style="width: 120px;">3ª Passada</th>
          <th>Assinatura / Obs</th>
        `;

        snapshot.forEach(docSnap => {
          const t = docSnap.data();
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="fw-bold text-center">#${t.senha}</td>
            <td>${t.lacador1} / ${t.lacador2} ${t.lacador3 ? `/ ${t.lacador3}` : ''}</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          `;
          corpo.appendChild(tr);
        });

      } else if (tipo === "financeiro") {
        titulo.innerText = "Relatório Financeiro de Inscrições";
        cabecalho.innerHTML = `
          <th style="width: 80px;">Senha</th>
          <th>Laçadores</th>
          <th>Status Pagamento</th>
          <th>Soma Pts</th>
        `;

        snapshot.forEach(docSnap => {
          const t = docSnap.data();
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="fw-bold text-center">#${t.senha}</td>
            <td>${t.lacador1} / ${t.lacador2} ${t.lacador3 ? `/ ${t.lacador3}` : ''}</td>
            <td><strong>${t.statusPago ? t.statusPago.toUpperCase() : 'PENDENTE'}</strong></td>
            <td>${t.somaPontos || 0}</td>
          `;
          corpo.appendChild(tr);
        });
      }
    }

    selectTipo.addEventListener("change", gerarRelatorio);
    gerarRelatorio();

    document.getElementById("btn-sair").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });
  </script>
</body>
</html>
