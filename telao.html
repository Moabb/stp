<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telão / Transmissão Ao Vivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #020617;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
    }
    .header-telao {
      border-bottom: 3px solid #2563eb;
      padding-bottom: 15px;
    }
    .display-cronometro-telao {
      font-family: 'Courier New', Courier, monospace;
      font-size: 8rem;
      font-weight: 900;
      color: #22c55e;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
      background-color: #0f172a;
      border: 4px solid #334155;
      border-radius: 20px;
      text-align: center;
      padding: 20px;
      line-height: 1;
    }
    .card-laçadores {
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 25px;
    }
    .nome-lacador {
      font-size: 2.2rem;
      font-weight: bold;
      color: #f8fafc;
    }
    .senha-badge {
      font-size: 2.5rem;
      font-weight: bold;
      background-color: #eab308;
      color: #000;
      padding: 5px 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Topo -->
  <div class="header-telao d-flex justify-content-between align-items-center">
    <div>
      <h1 class="fw-bold m-0" id="nome-evento-telao">CAMPEONATO DE LAÇO</h1>
      <h4 class="text-primary m-0" id="bateria-ativa-telao">BATERIA --</h4>
    </div>
    <div id="badge-senha-container" class="d-none">
      <span class="senha-badge" id="senha-telao">SENHA #00</span>
    </div>
  </div>

  <!-- Centro: Cronômetro e Pista -->
  <div class="row align-items-center my-auto">
    <div class="col-lg-7">
      <div class="card-laçadores" id="container-integrantes">
        <h3 class="text-muted mb-3">EQUIPE NA PISTA</h3>
        <div class="nome-lacador text-muted">Aguardando próximo trio...</div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="display-cronometro-telao" id="cronometro-telao">00.000</div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="d-flex justify-content-between text-muted border-top border-secondary pt-3">
    <span>Sistema de Prova de Laço v2.0</span>
    <span id="status-conexao" class="text-success">● AO VIVO</span>
  </div>

  <script type="module">
    import { db, doc, onSnapshot } from "./firebase-config.js";

    const cronometro = document.getElementById("cronometro-telao");
    const containerIntegrantes = document.getElementById("container-integrantes");
    const badgeSenhaContainer = document.getElementById("badge-senha-container");
    const senhaTelao = document.getElementById("senha-telao");
    const bateriaAtiva = document.getElementById("bateria-ativa-telao");

    // Sincronização em Tempo Real com a Mesa do Juiz
    onSnapshot(doc(db, "ao_vivo", "telao_pista"), (snapshot) => {
      if (!snapshot.exists()) return;
      const data = snapshot.data();

      // Bateria
      if (data.bateria) {
        bateriaAtiva.innerText = `BATERIA: ${data.bateria.toUpperCase()}`;
      }

      // Tempo
      cronometro.innerText = data.tempoTexto || "00.000";
      
      if (data.statusResultado === "SAT") {
        cronometro.style.color = "#38bdf8";
      } else if (data.statusResultado === "NULO") {
        cronometro.style.color = "#ef4444";
      } else {
        cronometro.style.color = "#22c55e";
      }

      // Trio
      if (data.trio) {
        badgeSenhaContainer.classList.remove("d-none");
        senhaTelao.innerText = `SENHA #${data.trio.senha}`;

        containerIntegrantes.innerHTML = `
          <h4 class="text-primary mb-3">EQUIPE NA PISTA</h4>
          <div class="nome-lacador mb-2">1: ${data.trio.lacador1}</div>
          <div class="nome-lacador mb-2">2: ${data.trio.lacador2}</div>
          ${data.trio.lacador3 ? `<div class="nome-lacador">3: ${data.trio.lacador3}</div>` : ''}
        `;
      } else {
        badgeSenhaContainer.classList.add("d-none");
        containerIntegrantes.innerHTML = `
          <h3 class="text-muted mb-3">EQUIPE NA PISTA</h3>
          <div class="nome-lacador text-muted">Aguardando próximo trio...</div>
        `;
      }
    });
  </script>
</body>
</html>
