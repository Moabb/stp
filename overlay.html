<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay OBS - Team Penning Live</title>
  <script type="module" src="./firebase-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: transparent; overflow: hidden; width: 100vw; height: 100vh; position: relative; }

    .lower-third-container {
      position: absolute;
      bottom: 40px;
      left: 50px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.5s ease-in-out;
      transform: translateY(200px);
      opacity: 0;
    }
    .lower-third-container.active { transform: translateY(0); opacity: 1; }

    .box-pista {
      background: linear-gradient(90deg, #111 0%, rgba(20,20,20,0.95) 100%);
      border-left: 6px solid #ffb703;
      padding: 12px 25px;
      border-radius: 4px;
      color: #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .box-pista h3 { color: #ffb703; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .box-pista p { font-size: 1.4rem; font-weight: bold; margin-top: 2px; }

    .box-proximo {
      background: rgba(0,0,0,0.85);
      border-left: 6px solid #0077b6;
      padding: 8px 20px;
      border-radius: 4px;
      color: #ccc;
      width: fit-content;
    }

    .overlay-bateria-container {
      position: absolute;
      top: 50px;
      right: 50px;
      width: 450px;
      background: rgba(18, 18, 18, 0.95);
      border: 1px solid #333;
      border-top: 5px solid #ffb703;
      border-radius: 6px;
      padding: 15px;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      transition: all 0.5s ease-in-out;
      transform: translateX(500px);
      opacity: 0;
    }
    .overlay-bateria-container.active { transform: translateX(0); opacity: 1; }

    .overlay-bateria-container h2 {
      font-size: 1.1rem;
      color: #ffb703;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-align: center;
    }

    .tabela-parcial { width: 100%; border-collapse: collapse; }
    .tabela-parcial th, .tabela-parcial td { padding: 8px 6px; text-align: left; font-size: 0.85rem; }
    .tabela-parcial th { color: #aaa; border-bottom: 1px solid #444; }
    .tabela-parcial tr:nth-child(even) { background: rgba(255,255,255,0.03); }
    .tabela-parcial td.tempo { font-weight: bold; color: #2a9d8f; text-align: right; }
  </style>
</head>
<body>

  <div class="lower-third-container" id="lowerThird">
    <div class="box-pista">
      <h3>🤠 NA PISTA AGORA</h3>
      <p id="txtTrioAtual">Aguardando trio...</p>
    </div>
    <div class="box-proximo">
      <span style="color: #0077b6; font-weight: bold;">PRÓXIMO:</span> <span id="txtTrioProximo" style="color:#fff;">-</span>
    </div>
  </div>

  <div class="overlay-bateria-container" id="overlayBateria">
    <h2 id="tituloBateria">CLASSIFICAÇÃO PARCIAL</h2>
    <table class="tabela-parcial">
      <thead>
        <tr>
          <th>#</th>
          <th>Trio / Equipe</th>
          <th style="text-align:right;">Tempo</th>
        </tr>
      </thead>
      <tbody id="corpoTabelaParcial">
        <tr><td colspan="3" style="text-align:center; color:#777;">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { db, doc, collection, getDoc, getDocs, onSnapshot, query, where } from "./firebase-config.js";

    const urlParams = new URLSearchParams(window.location.search);
    let compId = urlParams.get("compId");

    const lowerThird = document.getElementById("lowerThird");
    const txtTrioAtual = document.getElementById("txtTrioAtual");
    const txtTrioProximo = document.getElementById("txtTrioProximo");

    const overlayBateria = document.getElementById("overlayBateria");
    const tituloBateria = document.getElementById("tituloBateria");
    const corpoTabelaParcial = document.getElementById("corpoTabelaParcial");

    let unsubOverlayState = null;
    let compDataCache = null;

    function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function calcularBateria(ordemPista, tamanhoLote, numBaterias) {
      if (!ordemPista || ordemPista <= 0) return 1;
      const qtdBaterias = numBaterias || 2;
      const loteTam = tamanhoLote || 25;
      const indiceLote = Math.floor((ordemPista - 1) / loteTam);
      return (indiceLote % qtdBaterias) + 1;
    }

    if (!compId) {
      onSnapshot(doc(db, "painel_global", "ativo"), (docSnap) => {
        if (docSnap.exists()) {
          const globalData = docSnap.data();
          if (globalData.competicaoId && globalData.competicaoId !== compId) {
            compId = globalData.competicaoId;
            escutarEstadoOverlay(compId);
          }
        }
      });
    } else {
      escutarEstadoOverlay(compId);
    }

    function escutarEstadoOverlay(idCompeticao) {
      if (unsubOverlayState) unsubOverlayState();

      unsubOverlayState = onSnapshot(doc(db, "overlay_state", idCompeticao), async (docSnap) => {
        if (!docSnap.exists()) return;
        const data = docSnap.data();

        if (!compDataCache || compDataCache.id !== idCompeticao) {
          const compSnap = await getDoc(doc(db, "competicoes", idCompeticao));
          if (compSnap.exists()) compDataCache = { id: idCompeticao, ...compSnap.data() };
        }

        if (data.lowerThirdVisivel) {
          txtTrioAtual.innerText = data.trioAtual || "Aguardando definição...";
          txtTrioProximo.innerText = data.trioProximo || "Em breve";
          lowerThird.classList.add("active");
        } else {
          lowerThird.classList.remove("active");
        }

        if (data.bateriaAtivaVisivel) {
          tituloBateria.innerText = `CLASSIFICAÇÃO - ${data.bateriaAtivaVisivel}ª BATERIA`;
          carregarDadosBateriaParcial(idCompeticao, data.bateriaAtivaVisivel, data.categoriaAtiva, data.faseAtiva);
          overlayBateria.classList.add("active");
        } else {
          overlayBateria.classList.remove("active");
        }
      });
    }

    async function carregarDadosBateriaParcial(idCompeticao, numBateria, catNome, faseNome) {
      try {
        let categoriasParaBuscar = [catNome];
        if (compDataCache && compDataCache.vinculoEmbutido && compDataCache.vinculoEmbutido.catPai === catNome) {
          categoriasParaBuscar.push(compDataCache.vinculoEmbutido.catEspelho);
        }

        const q = query(
          collection(db, "trios"), 
          where("competicaoId", "==", idCompeticao),
          where("categoria", "in", categoriasParaBuscar),
          where("fase", "==", faseNome || "CLASSIFICACAO")
        );

        const snap = await getDocs(q);
        let triosBateria = [];
        
        const catConfig = compDataCache && compDataCache.categorias ? compDataCache.categorias.find(c => c.nome === catNome) : null;
        const numBateriasTotal = catConfig ? (catConfig.qtdBaterias || 2) : 2;
        const tamanhoLote = catConfig ? (catConfig.limiteGado || 25) : 25;

        snap.forEach(d => {
          const t = d.data();
          if (t.status === "OK" && t.tempo > 0) {
            const ordemNum = t.ordemPista || t.senha;
            const batCalc = calcularBateria(ordemNum, tamanhoLote, numBateriasTotal);
            if (batCalc === numBateria) {
              triosBateria.push(t);
            }
          }
        });

        triosBateria.sort((a, b) => parseFloat(a.tempo) - parseFloat(b.tempo));

        if (triosBateria.length === 0) {
          corpoTabelaParcial.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">Nenhum tempo válido nesta bateria.</td></tr>`;
          return;
        }

        corpoTabelaParcial.innerHTML = "";
        triosBateria.slice(0, 5).forEach((item, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${index + 1}º</strong></td>
            <td>${escapeHTML(item.integrantes ? item.integrantes.join(" / ") : "Trio #" + item.senha)}</td>
            <td class="tempo">${parseFloat(item.tempo).toFixed(3)}s</td>
          `;
          corpoTabelaParcial.appendChild(tr);
        });
      } catch (err) {
        console.error("Erro ao carregar ranking da bateria:", err);
      }
    }
  </script>
</body>
</html>
