<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerar Semifinal / Final</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Configurar Nova Fase (Semifinal / Final)</h2>
    <div class="form-group">
      <label for="compId">ID da Competição:</label>
      <input type="text" id="compId" placeholder="Ex: comp_12345">
    </div>
    <div class="form-group">
      <label for="nomeSemi">Nome da Fase:</label>
      <input type="text" id="nomeSemi" placeholder="Ex: Semifinal - SOMA 3">
    </div>
    <div class="form-group">
      <label for="dataSemi">Data:</label>
      <input type="date" id="dataSemi">
    </div>
    <div class="form-group">
      <label for="numBaterias">Número de Baterias:</label>
      <input type="number" id="numBaterias" value="1" min="1">
    </div>
    <div class="form-group">
      <label for="corridasPorBateria">Limite de Gado / Corridas por Bateria:</label>
      <input type="number" id="corridasPorBateria" value="25" min="1">
    </div>
    <div class="form-group">
      <label for="classificadosPorBateria">Classificados por Bateria:</label>
      <input type="number" id="classificadosPorBateria" value="5" min="1">
    </div>
    <button id="btnGerarFase">Salvar e Gerar Fase</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // INSIRA SUA CONFIGURAÇÃO DO FIREBASE AQUI
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("btnGerarFase").addEventListener("click", async () => {
      const compId = document.getElementById("compId").value.trim();
      const nomeSemi = document.getElementById("nomeSemi").value.trim();
      const dataSemi = document.getElementById("dataSemi").value;
      const numBaterias = parseInt(document.getElementById("numBaterias").value, 10);
      const corridasPorBateria = parseInt(document.getElementById("corridasPorBateria").value, 10);
      const classificadosPorBateria = parseInt(document.getElementById("classificadosPorBateria").value, 10);

      if (!compId || !nomeSemi) {
        alert("Por favor, preencha o ID da competição e o nome da fase!");
        return;
      }

      try {
        const compRef = doc(db, "competicoes", compId);
        const compSnap = await getDoc(compRef);

        if (!compSnap.exists()) {
          alert("Competição não encontrada!");
          return;
        }

        const compData = compSnap.data();
        const categoriasAtuais = compData.categorias || [];

        // Monta a nova configuração de categoria
        const novaCategoriaConfig = {
          nome: nomeSemi,
          data: dataSemi || new Date().toISOString().split('T')[0],
          qtdBaterias: numBaterias,
          limiteGado: corridasPorBateria,
          classificadosPorBateria: classificadosPorBateria
        };

        // Remove duplicadas com mesmo nome se existirem e insere a atualizada
        const categoriasAtualizadas = categoriasAtuais.filter(c => c.nome.trim().toLowerCase() !== nomeSemi.toLowerCase());
        categoriasAtualizadas.push(novaCategoriaConfig);

        // Atualiza a competição com a nova categoria configurada
        await updateDoc(compRef, {
          categorias: categoriasAtualizadas
        });

        alert(`Fase "${nomeSemi}" criada e configurada com sucesso na competição!`);
      } catch (error) {
        console.error("Erro ao salvar configuração da fase:", error);
        alert("Erro ao salvar a fase no Firebase.");
      }
    });
  </script>
</body>
</html>
