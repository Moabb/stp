<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição de Trios - Team Penning</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #059669;
            --accent: #f59e0b;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); }

        header {
            background-color: #090d16;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-title { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        nav { display: flex; gap: 15px; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; padding: 6px 12px; border-radius: 6px; }
        nav a:hover, nav a.active { color: var(--text-light); background-color: var(--card-bg); }

        .container { padding: 24px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        .card { background-color: var(--card-bg); border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); }
        .card h2 { color: var(--accent); font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--border-color); color: white; border-radius: 6px; }

        .btn-success { background-color: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        th { color: var(--accent); background-color: var(--input-bg); }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">🤠 TEAM PENNING</div>
        <nav>
            <a href="config.html">Parâmetros</a>
            <a href="cadastro.html" class="active">Inscrições / Trios</a>
            <a href="admin.html">Mesa do Juiz</a>
            <a href="semifinais.html">Semifinais</a>
            <a href="final.html">Grande Final</a>
            <a href="painel.html" target="_blank">Painel (TV)</a>
        </nav>
        <button style="background-color: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px;">Sair</button>
    </header>

    <div class="container">
        <!-- Cadastrar Trio -->
        <div class="card">
            <h2>INSCREVER NOVO TRIO</h2>
            <div class="form-group">
                <label>Número da Senha / Inscrição:</label>
                <input type="number" class="form-control" value="2">
            </div>
            <div class="form-group">
                <label>1º Cavaleiro:</label>
                <input type="text" class="form-control" placeholder="Nome do 1º participante">
            </div>
            <div class="form-group">
                <label>2º Cavaleiro:</label>
                <input type="text" class="form-control" placeholder="Nome do 2º participante">
            </div>
            <div class="form-group">
                <label>3º Cavaleiro:</label>
                <input type="text" class="form-control" placeholder="Nome do 3º participante">
            </div>
            <div class="form-group">
                <label>Animais / Observações (Opcional):</label>
                <input type="text" class="form-control" placeholder="Ex: Cavalos ou Haras">
            </div>
            <button class="btn-success">Cadastrar Trio</button>
        </div>

        <!-- Lista de Inscrições -->
        <div class="card">
            <h2>TRIOS INSCRITOS - SOMA 3</h2>
            <table>
                <thead>
                    <tr>
                        <th>Senha</th>
                        <th>Integrantes do Trio</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><b style="color:var(--accent);">#1</b></td>
                        <td>DANILO / MOABB / SILVA</td>
                        <td><button style="background:#334155; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">✏️ Editar</button></td>
                    </tr>
                    <tr>
                        <td><b style="color:var(--accent);">#2</b></td>
                        <td>DANILO / MOABB / JOSE</td>
                        <td><button style="background:#334155; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">✏️ Editar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
