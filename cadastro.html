<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrições e Trios - Novo Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; }
    .form-control, .form-select { background-color: #0f172a; color: #fff; border: 1px solid #334155; }
    .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #2563eb; box-shadow: none; }
    .table-dark-custom { background-color: #1e293b; color: #fff; }
    .table-dark-custom th { background-color: #0f172a; color: #94a3b8; border-color: #334155; }
    .table-dark-custom td { border-color: #334155; vertical-align: middle; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">PROVA DE LAÇO</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="config.html">Parâmetros</a>
        <a class="nav-link active" href="cadastro.html">Inscrições/Trios</a>
        <a class="nav-link" href="admin.html">Mesa do Juiz</a>
        <a class="nav-link" href="apuracao.html">Apuração</a>
        <a class="nav-link" href="telao.html" target="_blank">Telão (OBS)</a>
        <a class="nav-link" href="relatorios.html">Relatórios</a>
      </div>
      <button class="btn btn-outline-danger btn-sm" id="btn-sair">Sair</button>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-5">
    <div class="row g-4">
      <!-- Formulário de Cadastro -->
      <div class="col-lg-4">
        <div class="card card-custom p-3">
          <h5 class="text-primary border-bottom border-secondary pb-2 mb-3">Nova Inscrição / Trio</h5>
          
          <form id="form-trio">
            <div class="mb-3">
              <label class="form-label">Nº da Senha / Inscrição</label>
              <input type="number" id="senhaInscricao" class="form-control" required placeholder="Ex: 101">
            </div>

            <div class="mb-3">
              <label class="form-label">Laçador 1 (Cabeceiro)</label>
              <input type="text" id="lacador1" class="form-control" required placeholder="Nome do integrante 1">
            </div>

            <div class="mb-3">
              <label class="form-label">Laçador 2 (Pezeiro)</label>
              <input type="text" id="lacador2" class="form-control" required placeholder="Nome do integrante 2">
            </div>

            <div class="mb-3">
              <label class="form-label">Laçador 3 (Terceiro/Esteira)</label>
              <input type="text" id="lacador3" class="form-control" placeholder="Opcional se for dupla">
            </div>

            <div class="row mb-3">
              <div class="col-6">
                <label class="form-label">Soma/Pontuação</label>
                <input type="number" id="somaPontos" class="form-control" value="0">
              </div>
              <div class="col-6">
                <label class="form-label">Status Pagamento</label>
                <select id="statusPago" class="form-select">
                  <option value="pago">Pago</option>
                  <option value="pendente">Pendente</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold" id="btn-salvar-trio">Cadastrar Trio</button>
          </form>
        </div>
      </div>

      <!-- Tabela de Trios Cadastrados -->
      <div class="col-lg-8">
        <div class="card card-custom p-3">
          <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
            <h5 class="text-primary mb-0">Trios Cadastrados</h5>
            <span class="badge bg-primary fs-6" id="total-trios">Total: 0</span>
          </div>

          <div class="table-responsive">
            <table class="table table-dark-custom align-middle">
              <thead>
                <tr>
                  <th>Senha</th>
                  <th>Integrantes</th>
                  <th>Soma</th>
                  <th>Status</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-trios-body">
                <tr><td colspan="5" class="text-center text-muted">Carregando trios...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, collection, addDoc, onSnapshot, doc, deleteDoc, checarAutenticacao, signOut, auth, query, orderBy } from "./firebase-config.js";

    await checarAutenticacao();

    const triosRef = collection(db, "trios");
    const tbody = document.getElementById("tabela-trios-body");
    const totalTriosBadge = document.getElementById("total-trios");

    // Escutar lista de trios em tempo real
    const q = query(triosRef, orderBy("senha", "asc"));
    onSnapshot(q, (snapshot) => {
      tbody.innerHTML = "";
      totalTriosBadge.innerText = `Total: ${snapshot.size}`;

      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Nenhum trio cadastrado ainda.</td></tr>`;
        return;
      }

      snapshot.forEach((documento) => {
        const trio = documento.data();
        const id = documento.id;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="fw-bold text-warning">#${trio.senha}</td>
          <td>
            <div><strong>1:</strong> ${trio.lacador1}</div>
            <div><strong>2:</strong> ${trio.lacador2}</div>
            ${trio.lacador3 ? `<div><strong>3:</strong> ${trio.lacador3}</div>` : ''}
          </td>
          <td><span class="badge bg-secondary">${trio.somaPontos || 0} pts</span></td>
          <td>
            <span class="badge ${trio.statusPago === 'pago' ? 'bg-success' : 'bg-danger'}">
              ${trio.statusPago === 'pago' ? 'PAGO' : 'PENDENTE'}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm btn-deletar" data-id="${id}">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Eventos de Deletar
      document.querySelectorAll(".btn-deletar").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const idTrio = e.target.getAttribute("data-id");
          if (confirm("Deseja realmente remover este trio?")) {
            await deleteDoc(doc(db, "trios", idTrio));
          }
        });
      });
    });

    // Salvar Novo Trio
    document.getElementById("form-trio").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const senha = parseInt(document.getElementById("senhaInscricao").value);
      const lacador1 = document.getElementById("lacador1").value.trim();
      const lacador2 = document.getElementById("lacador2").value.trim();
      const lacador3 = document.getElementById("lacador3").value.trim();
      const somaPontos = parseInt(document.getElementById("somaPontos").value) || 0;
      const statusPago = document.getElementById("statusPago").value;

      try {
        await addDoc(triosRef, {
          senha,
          lacador1,
          lacador2,
          lacador3,
          somaPontos,
          statusPago,
          faseAtual: "classificatoria",
          tempos: {}, // Ex: { bateria1: 8.45, bateria2: 9.10 }
          penalidades: {}, // Ex: { bateria1: 5 }
          criadoEm: new Date()
        });

        document.getElementById("form-trio").reset();
      } catch (err) {
        alert("Erro ao cadastrar trio: " + err.message);
      }
    });

    document.getElementById("btn-sair").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });
  </script>
</body>
</html>
