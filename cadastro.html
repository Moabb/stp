<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrições e Trios - Novo Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; }
    .table-dark-custom { background-color: #1e293b; color: #fff; }
    .table-dark-custom th { background-color: #0f172a; color: #94a3b8; border-color: #334155; }
    .table-dark-custom td { border-color: #334155; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">PROVA DE LAÇO</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="config.html">Parâmetros</a>
        <a class="nav-link active" href="cadastro.html">Inscrições/Trios</a>
        <a class="nav-link" href="admin.html">Mesa do Juiz</a>
        <a class="nav-link" href="apuracao.html">Apuração</a>
        <a class="nav-link" href="telao.html" target="_blank">Telão (OBS)</a>
        <a class="nav-link" href="relatorios.html">Relatórios</a>
      </div>
      <button class="btn btn-outline-danger btn-sm" id="btn-sair">Sair</button>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-5">
    <div class="row g-4">
      
      <!-- Formulário de Cadastro -->
      <div class="col-lg-4">
        <div class="card card-custom p-4">
          <h4 class="mb-3 text-primary fw-bold">Nova Inscrição / Trio</h4>
          <form id="form-trio">
            
            <div class="mb-3">
              <label class="form-label text-muted">Categoria</label>
              <select class="form-select bg-dark text-white border-secondary" id="select-categoria" required>
                <option value="">Carregando categorias...</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted">Nº da Senha / Inscrição</label>
              <input type="number" class="form-control bg-dark text-white border-secondary" id="senha" required placeholder="Ex: 101">
            </div>

            <div class="mb-3">
              <label class="form-label text-muted">Laçador 1 (Cabeceiro)</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="lacador1" required placeholder="Nome do integrante 1">
            </div>

            <div class="mb-3">
              <label class="form-label text-muted">Laçador 2 (Pezeiro)</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="lacador2" required placeholder="Nome do integrante 2">
            </div>

            <div class="mb-3">
              <label class="form-label text-muted">Laçador 3 (Terceiro/Esteira)</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="lacador3" placeholder="Opcional se for dupla">
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label text-muted">Soma/Pontuação</label>
                <input type="number" step="0.5" class="form-control bg-dark text-white border-secondary" id="somaPontos" value="0">
              </div>
              <div class="col-6 mb-3">
                <label class="form-label text-muted">Status Pagamento</label>
                <select class="form-select bg-dark text-white border-secondary" id="statusPago">
                  <option value="pago">Pago</option>
                  <option value="pendente">Pendente</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold mt-2" id="btn-salvar">Cadastrar Trio</button>
          </form>
        </div>
      </div>

      <!-- Tabela de Trios Cadastrados -->
      <div class="col-lg-8">
        <div class="card card-custom p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold">Trios Cadastrados</h4>
            <span class="badge bg-primary fs-6" id="total-trios">Total: 0</span>
          </div>

          <div class="table-responsive">
            <table class="table table-dark-custom align-middle">
              <thead>
                <tr>
                  <th>Senha</th>
                  <th>Categoria</th>
                  <th>Integrantes</th>
                  <th>Soma</th>
                  <th>Status</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-trios-body">
                <tr><td colspan="6" class="text-center text-muted">Carregando trios...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { db, collection, addDoc, onSnapshot, doc, getDoc, deleteDoc, query, orderBy, checarAutenticacao, signOut, auth } from "./firebase-config.js";

    await checarAutenticacao();

    const form = document.getElementById("form-trio");
    const selectCategoria = document.getElementById("select-categoria");
    const tbody = document.getElementById("tabela-trios-body");
    const totalTriosBadge = document.getElementById("total-trios");

    // 1. Carregar Categorias configuradas nos Parâmetros
    async function carregarCategorias() {
      try {
        const snap = await getDoc(doc(db, "parametros", "config_geral"));
        selectCategoria.innerHTML = "";

        if (snap.exists() && snap.data().categorias) {
          const categorias = snap.data().categorias.split(",").map(c => c.trim());
          categorias.forEach(cat => {
            if (cat) {
              const option = document.createElement("option");
              option.value = cat;
              option.textContent = cat;
              selectCategoria.appendChild(option);
            }
          });
        } else {
          selectCategoria.innerHTML = `<option value="GERAL">GERAL</option>`;
        }
      } catch (err) {
        console.error("Erro ao carregar categorias:", err);
        selectCategoria.innerHTML = `<option value="GERAL">GERAL</option>`;
      }
    }

    // 2. Salvar Novo Trio
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-salvar");
      btn.disabled = true;
      btn.innerText = "Salvando...";

      try {
        const novoTrio = {
          categoria: selectCategoria.value,
          senha: parseInt(document.getElementById("senha").value),
          lacador1: document.getElementById("lacador1").value.trim(),
          lacador2: document.getElementById("lacador2").value.trim(),
          lacador3: document.getElementById("lacador3").value.trim() || "",
          somaPontos: parseFloat(document.getElementById("somaPontos").value) || 0,
          statusPago: document.getElementById("statusPago").value,
          faseAtual: "classificatoria",
          tempos: {},
          criadoEm: new Date().toISOString()
        };

        await addDoc(collection(db, "trios"), novoTrio);
        form.reset();
        alert("Trio cadastrado com sucesso!");
      } catch (err) {
        alert("Erro ao cadastrar trio: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Cadastrar Trio";
      }
    });

    // 3. Listar Trios em Tempo Real
    const q = query(collection(db, "trios"), orderBy("senha", "asc"));
    onSnapshot(q, (snapshot) => {
      tbody.innerHTML = "";
      totalTriosBadge.innerText = `Total: ${snapshot.size}`;

      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Nenhum trio cadastrado ainda.</td></tr>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const trio = docSnap.data();
        const id = docSnap.id;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="fw-bold text-warning">#${trio.senha}</td>
          <td><span class="badge bg-secondary">${trio.categoria || 'GERAL'}</span></td>
          <td>
            <strong>${trio.lacador1}</strong> / <strong>${trio.lacador2}</strong>
            ${trio.lacador3 ? ` / ${trio.lacador3}` : ''}
          </td>
          <td>${trio.somaPontos || 0}</td>
          <td>
            <span class="badge ${trio.statusPago === 'pago' ? 'bg-success' : 'bg-danger'}">
              ${(trio.statusPago || 'pago').toUpperCase()}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm btn-deletar" data-id="${id}">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Eventos de Exclusão
      document.querySelectorAll(".btn-deletar").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const trioId = e.target.getAttribute("data-id");
          if (confirm("Deseja realmente excluir este trio?")) {
            await deleteDoc(doc(db, "trios", trioId));
          }
        });
      });
    });

    // Sair
    document.getElementById("btn-sair").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });

    carregarCategorias();
  </script>
</body>
</html>
