<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Team Penning</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #059669;
            --accent: #f59e0b;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); }

        /* Top Navbar */
        header {
            background-color: #090d16;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-title { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; color: var(--accent); }
        nav { display: flex; gap: 15px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            transition: 0.2s;
        }
        nav a:hover, nav a.active { color: var(--text-light); background-color: var(--card-bg); }
        .btn-logout { background-color: var(--danger); color: white; padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; }

        /* Main Container */
        .container { padding: 24px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        .card h2 { color: var(--accent); font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        .form-control {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
        }

        .category-row {
            background-color: var(--input-bg);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-success { background-color: var(--primary); color: white; }
        .btn-outline { border: 1px dashed var(--accent); color: var(--accent); background: transparent; }

        .comp-card {
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
        }
        .comp-actions { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">🤠 TEAM PENNING</div>
        <nav>
            <a href="config.html" class="active">Parâmetros</a>
            <a href="cadastro.html">Inscrições / Trios</a>
            <a href="admin.html">Mesa do Juiz</a>
            <a href="semifinais.html">Semifinais</a>
            <a href="final.html">Grande Final</a>
            <a href="painel.html" target="_blank">Painel (TV)</a>
        </nav>
        <button class="btn-logout">Sair</button>
    </header>

    <div class="container">
        <!-- Editar Competição -->
        <div class="card">
            <h2>EDITAR COMPETIÇÃO / REGULAMENTO</h2>
            <div class="form-group">
                <label>Nome Principal da Competição / Evento</label>
                <input type="text" class="form-control" value="10º TEAM PENNING">
            </div>
            <div class="form-group">
                <label>Data de Início do Evento</label>
                <input type="date" class="form-control" value="2026-07-30">
            </div>

            <h3 style="font-size:0.9rem; color: var(--text-muted); margin: 15px 0 10px;">Regulamento por Categoria:</h3>
            
            <div class="category-row">
                <input type="text" class="form-control" placeholder="Nome Categoria" value="SOMA 3">
                <input type="date" class="form-control" value="2026-07-30">
                <input type="number" class="form-control" placeholder="Nº Bat." value="2">
                <input type="number" class="form-control" placeholder="Corridas" value="25">
                <input type="number" class="form-control" placeholder="Classif." value="10">
                <button style="background:none; border:none; color:var(--danger); cursor:pointer;">✖</button>
            </div>

            <button class="btn btn-outline" style="margin-bottom: 15px;">+ Adicionar Categoria</button>
            <button class="btn btn-success">Atualizar Competição</button>
        </div>

        <!-- Minhas Competições -->
        <div class="card">
            <h2>MINHAS COMPETIÇÕES CADASTRADAS</h2>
            <div class="comp-card">
                <h3>10º TEAM PENNING</h3>
                <p style="font-size:0.85rem; color:var(--text-muted); margin: 5px 0;">Início: 2026-07-30 | Categorias: SOMA 3</p>
                <div class="comp-actions">
                    <button class="btn btn-outline" style="font-size:0.8rem;">✏️ Editar Regulamento</button>
                    <button class="btn btn-success" style="font-size:0.8rem;">📝 Cadastrar Trios</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
