<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerar Grande Final</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Configurar Grande Final</h2>
    <div class="form-group">
      <label for="compId">ID da Competição:</label>
      <input type="text" id="compId" placeholder="Ex: comp_12345">
    </div>
    <div class="form-group">
      <label for="nomeFinal">Nome da Fase Final:</label>
      <input type="text" id="nomeFinal" placeholder="Ex: Final - SOMA 3">
    </div>
    <div class="form-group">
      <label for="dataFinal">Data:</label>
      <input type="date" id="dataFinal">
    </div>
    <div class="form-group">
      <label for="numBaterias">Número de Baterias:</label>
      <input type="number" id="numBaterias" value="1" min="1">
    </div>
    <div class="form-group">
      <label for="corridasPorBateria">Limite de Gado / Corridas por Bateria:</label>
      <input type="number" id="corridasPorBateria" value="25" min="1">
    </div>
    <div class="form-group">
      <label for="classificadosPorBateria">Vagas / Premiações por Bateria:</label>
      <input type="number" id="classificadosPorBateria" value="5" min="1">
    </div>
    <button id="btnGerarFinal">Salvar e Criar Final</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // INSIRA SUA CONFIGURAÇÃO DO FIREBASE AQUI
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("btnGerarFinal").addEventListener("click", async () => {
      const compId = document.getElementById("compId").value.trim();
      const nomeFinal = document.getElementById("nomeFinal").value.trim();
      const dataFinal = document.getElementById("dataFinal").value;
      const numBaterias = parseInt(document.getElementById("numBaterias").value, 10);
      const corridasPorBateria = parseInt(document.getElementById("corridasPorBateria").value, 10);
      const classificadosPorBateria = parseInt(document.getElementById("classificadosPorBateria").value, 10);

      if (!compId || !nomeFinal) {
        alert("Por favor, preencha o ID da competição e o nome da fase final!");
        return;
      }

      try {
        const compRef = doc(db, "competicoes", compId);
        const compSnap = await getDoc(compRef);

        if (!compSnap.exists()) {
          alert("Competição não encontrada!");
          return;
        }

        const compData = compSnap.data();
        const categoriasAtuais = compData.categorias || [];

        // Estrutura a configuração da categoria para a Final
        const novaCategoriaConfig = {
          nome: nomeFinal,
          data: dataFinal || new Date().toISOString().split('T')[0],
          qtdBaterias: numBaterias,
          limiteGado: corridasPorBateria,
          classificadosPorBateria: classificadosPorBateria
        };

        // Atualiza a lista removendo versão anterior do mesmo nome (se houver) e adiciona a nova
        const categoriasAtualizadas = categoriasAtuais.filter(c => c.nome.trim().toLowerCase() !== nomeFinal.toLowerCase());
        categoriasAtualizadas.push(novaCategoriaConfig);

        // Atualiza diretamente no documento da competição em 'competicoes'
        await updateDoc(compRef, {
          categorias: categoriasAtualizadas
        });

        alert(`Grande Final "${nomeFinal}" criada e configurada com sucesso!`);
      } catch (error) {
        console.error("Erro ao salvar configuração da final:", error);
        alert("Erro ao salvar a fase final no Firebase.");
      }
    });
  </script>
</body>
</html>
