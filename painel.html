<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel em Tempo Real</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #f1c40f; }
    .grid-baterias { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; }
    .coluna-bateria { flex: 1; min-width: 280px; background-color: #1e1e1e; border-radius: 8px; padding: 15px; border: 1px solid #333; }
    .coluna-bateria h3 { margin-top: 0; color: #3498db; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    .item-corrida { background: #2c2c2c; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>

  <h1 id="tituloCategoria">Carregando Painel...</h1>
  <div id="containerBaterias" class="grid-baterias"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // INSIRA SUA CONFIGURAÇÃO DO FIREBASE AQUI
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const competicaoId = "COMPETICAO_ATIVA_ID"; 
    let competicaoAtiva = null;
    let categoriaAtual = "Semifinal - SOMA 3"; // Exemplo da categoria selecionada para exibir

    // Escuta os dados da competição principal
    onSnapshot(doc(db, "competicoes", competicaoId), (docSnap) => {
      if (docSnap.exists()) {
        competicaoAtiva = docSnap.data();
        document.getElementById("tituloCategoria").innerText = `Categoria: ${categoriaAtual}`;
        carregarCorridasEPainel();
      }
    });

    function carregarCorridasEPainel() {
      // Consulta as corridas da competição e categoria atual
      const q = query(
        collection(db, "corridas"), 
        where("competicaoId", "==", competicaoId),
        where("categoria", "==", categoriaAtual)
      );

      onSnapshot(q, (snapshot) => {
        const corridas = [];
        snapshot.forEach(doc => corridas.push({ id: doc.id, ...doc.data() }));
        renderizarLinha1BateriasSeparadas(corridas, categoriaAtual);
      });
    }

    function renderizarLinha1BateriasSeparadas(corridasCategoria, catAtual) {
      if (!competicaoAtiva) return;

      // Busca as configurações da categoria no array da competição
      const categorias = competicaoAtiva.categorias || [];
      const catConfig = categorias.find(c => c.nome.trim().toLowerCase() === catAtual.trim().toLowerCase());

      // Lê o número de baterias e vagas cadastrados (para qualquer fase)
      const numBaterias = catConfig ? (catConfig.qtdBaterias || 1) : 1;
      const vagasPorBateria = catConfig ? (catConfig.classificadosPorBateria || 5) : 5;

      const container = document.getElementById("containerBaterias");
      if (!container) return;
      
      container.innerHTML = ""; // Limpa visualização anterior

      // Renderiza as colunas de bateria conforme configurado
      for (let b = 1; b <= numBaterias; b++) {
        const corridasDaBateria = corridasCategoria.filter(c => (parseInt(c.bateria, 10) || 1) === b);
        
        const colEl = document.createElement("div");
        colEl.className = "coluna-bateria";
        colEl.innerHTML = `
          <h3>Bateria ${b} (Vagas: ${vagasPorBateria})</h3>
          <div class="lista-corridas" id="bateria-${b}"></div>
        `;

        container.appendChild(colEl);

        const listaEl = colEl.querySelector(`#bateria-${b}`);
        if (corridasDaBateria.length === 0) {
          listaEl.innerHTML = '<div class="item-corrida" style="color: #888;">Nenhuma corrida registrada</div>';
        } else {
          corridasDaBateria.forEach(corrida => {
            const item = document.createElement("div");
            item.className = "item-corrida";
            item.innerText = `#${corrida.senha || ''} - ${corrida.corredor || 'Atleta'} (${corrida.boi || 'Gado'})`;
            listaEl.appendChild(item);
          });
        }
      }
    }
  </script>
</body>
</html>
