<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telão / Transmissão OBS - Team Penning</title>
  <script type="module" src="./firebase-config.js"></script>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #141414;
      --accent-gold: #ffb703;
      --accent-green: #2a9d8f;
      --text-light: #ffffff;
      --border-color: #222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 30px; overflow-x: hidden; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent-gold); padding-bottom: 15px; margin-bottom: 25px; }
    header h1 { color: var(--accent-gold); font-size: 2.2rem; text-transform: uppercase; letter-spacing: 1px; }

    .badge-status { background: var(--accent-green); color: #fff; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 1rem; text-transform: uppercase; }

    .grid-painel { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
    @media (max-width: 1000px) { .grid-painel { grid-template-columns: 1fr; } }

    .card-painel { background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid var(--border-color); }
    .card-painel h2 { color: var(--accent-gold); font-size: 1.5rem; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; }

    .tabela-ranking { width: 100%; border-collapse: collapse; }
    .tabela-ranking th { font-size: 1.1rem; color: var(--accent-gold); padding: 12px; text-align: left; background: #1f1f1f; border-bottom: 2px solid var(--border-color); }
    .tabela-ranking td { padding: 14px 12px; border-bottom: 1px solid #222; font-size: 1.1rem; }

    .linha-classificado { background: rgba(42, 157, 143, 0.15); border-left: 4px solid var(--accent-green); }
    .posicao-destaque { font-weight: bold; color: var(--accent-gold); font-size: 1.3rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 id="txtTituloEvento">CARREGANDO EVENTO...</h1>
      <p id="txtSubtituloCategoria" style="color: #aaa; font-size: 1.1rem; margin-top: 5px;">Selecione a competição ativa</p>
    </div>
    <div class="badge-status" id="badgeFase">AO VIVO</div>
  </header>

  <div class="grid-painel">

    <!-- COLUNA PRINCIPAL: RANKING DA CATEGORIA -->
    <main class="card-painel">
      <h2>
        <span>CLASSIFICAÇÃO GERAL</span>
        <span id="txtLimiteCorte" style="font-size: 0.9rem; color: var(--accent-green);">Corte: Top 5</span>
      </h2>
      
      <table class="tabela-ranking">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Senha</th>
            <th>Integrantes / Trio</th>
            <th>Tempo</th>
          </tr>
        </thead>
        <tbody id="tbodyRanking">
          <tr><td colspan="4" style="color: #888; text-align: center;">Aguardando dados da competição...</td></tr>
        </tbody>
      </table>
    </main>

    <!-- COLUNA LATERAL: INFORMAÇÕES ADICIONAIS -->
    <aside class="card-painel">
      <h2>REGRAS DA FASE</h2>
      <div id="boxRegras" style="font-size: 1.05rem; line-height: 1.8; color: #ccc;">
        <p>Selecione uma competição ativa no Admin para visualizar as regras no telão.</p>
      </div>
    </aside>

  </div>

  <script type="module">
    import { 
      db, 
      collection, 
      getDoc, 
      getDocs, 
      query, 
      where, 
      doc, 
      onSnapshot 
    } from "./firebase-config.js";

    let competicaoAtiva = null;
    let categoriaAtualNome = null;

    document.addEventListener("DOMContentLoaded", () => {
      const compId = localStorage.getItem("selectedCompId");
      categoriaAtualNome = localStorage.getItem("selectedCatNome");

      if (compId) {
        escutarCompeticao(compId);
      }
    });

    function escutarCompeticao(compId) {
      const compRef = doc(db, "competicoes", compId);
      
      onSnapshot(compRef, (docSnap) => {
        if (!docSnap.exists()) return;

        competicaoAtiva = { id: docSnap.id, ...docSnap.data() };
        document.getElementById("txtTituloEvento").innerText = competicaoAtiva.nome || "EVENTO DE TEAM PENNING";

        if (!categoriaAtualNome && competicaoAtiva.categorias && competicaoAtiva.categorias.length > 0) {
          categoriaAtualNome = competicaoAtiva.categorias[0].nome;
        }

        renderizarRegrasFase();
        escutarRanking(compId, categoriaAtualNome);
      });
    }

    // EXTRAÇÃO UNIFICADA DAS REGRAS SALVAS NO ARRAY 'categorias'
    function obterRegrasCategoriaAtiva(nomeCategoriaAtiva) {
      if (!competicaoAtiva || !competicaoAtiva.categorias) return null;

      const cat = competicaoAtiva.categorias.find(c => c.nome === nomeCategoriaAtiva);
      if (!cat) return null;

      return {
        nome: cat.nome,
        fase: cat.fase || "CLASSIFICACAO",
        corteClassificados: parseInt(cat.classificadosPorBateria || 5), 
        limiteCorridas: parseInt(cat.limiteGado || cat.corridasPorBateria || 1)
      };
    }

    function renderizarRegrasFase() {
      const regras = obterRegrasCategoriaAtiva(categoriaAtualNome);
      const boxRegras = document.getElementById("boxRegras");

      if (!regras) {
        boxRegras.innerHTML = "<p>Nenhuma categoria ativa selecionada.</p>";
        return;
      }

      document.getElementById("txtSubtituloCategoria").innerText = `CATEGORIA: ${regras.nome}`;
      document.getElementById("badgeFase").innerText = regras.fase;
      document.getElementById("txtLimiteCorte").innerText = `Zona de Classificação: Top ${regras.corteClassificados}`;

      boxRegras.innerHTML = `
        <p><strong>Fase Atual:</strong> ${regras.fase}</p>
        <p><strong>Limite de Gado/Corridas:</strong> ${regras.limiteCorridas}</p>
        <p><strong>Vagas p/ Próxima Fase:</strong> ${regras.corteClassificados} Trios</p>
      `;
    }

    function escutarRanking(compId, nomeCategoria) {
      if (!nomeCategoria) return;

      const q = query(
        collection(db, "trios"),
        where("competicaoId", "==", compId),
        where("categoria", "==", nomeCategoria),
        where("status", "==", "CORREU")
      );

      onSnapshot(q, (snapshot) => {
        const trios = [];
        snapshot.forEach(docSnap => {
          trios.push({ id: docSnap.id, ...docSnap.data() });
        });

        trios.sort((a, b) => (a.melhorTempo || 9999) - (b.melhorTempo || 9999));
        renderizarTabelaPainel(trios);
      });
    }

    function renderizarTabelaPainel(trios) {
      const tbody = document.getElementById("tbodyRanking");
      tbody.innerHTML = "";

      if (trios.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: #888; text-align: center;">Nenhum tempo registrado nesta categoria até o momento.</td></tr>';
        return;
      }

      const regras = obterRegrasCategoriaAtiva(categoriaAtualNome);
      const limiteCorte = regras ? regras.corteClassificados : 5;

      trios.forEach((trio, index) => {
        const posicao = index + 1;
        const estaClassificado = posicao <= limiteCorte;
        const tr = document.createElement("tr");

        if (estaClassificado) {
          tr.className = "linha-classificado";
        }

        const integrantesStr = trio.integrantes ? trio.integrantes.join(" / ") : "Sem Nomes";
        const tempoFormatted = trio.melhorTempo ? `${parseFloat(trio.melhorTempo).toFixed(3)}s` : '--';

        tr.innerHTML = `
          <td class="posicao-destaque">#${posicao}</td>
          <td>${trio.senha || '-'}</td>
          <td>${integrantesStr}</td>
          <td style="font-weight: bold; color: var(--accent-gold);">${tempoFormatted}</td>
        `;

        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
