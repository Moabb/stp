<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa do Juiz - Novo Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b1329; color: #f8fafc; }
    .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
    .display-cronometro {
      font-family: 'Courier New', Courier, monospace;
      font-size: 5rem;
      font-weight: bold;
      color: #22c55e;
      background-color: #020617;
      border: 3px solid #1e293b;
      border-radius: 12px;
      text-align: center;
      padding: 10px;
      letter-spacing: 2px;
    }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; }
    .btn-action { height: 60px; font-size: 1.2rem; font-weight: bold; }
    .form-control, .form-select { background-color: #0f172a; color: #fff; border: 1px solid #334155; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">PROVA DE LAÇO</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="config.html">Parâmetros</a>
        <a class="nav-link" href="cadastro.html">Inscrições/Trios</a>
        <a class="nav-link active" href="admin.html">Mesa do Juiz</a>
        <a class="nav-link" href="apuracao.html">Apuração</a>
        <a class="nav-link" href="telao.html" target="_blank">Telão (OBS)</a>
        <a class="nav-link" href="relatorios.html">Relatórios</a>
      </div>
      <button class="btn btn-outline-danger btn-sm" id="btn-sair">Sair</button>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="row g-4">
      <!-- Painel de Controle e Cronômetro -->
      <div class="col-lg-7">
        <div class="card card-custom p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-primary m-0">Pista / Cronometragem</h4>
            <div class="d-flex align-items-center gap-2">
              <label class="fw-bold">Bateria:</label>
              <select id="select-bateria" class="form-select w-auto">
                <option value="1">1ª Bateria</option>
                <option value="2">2ª Bateria</option>
                <option value="3">3ª Bateria</option>
                <option value="semifinal">Semifinal</option>
                <option value="final">Final</option>
              </select>
            </div>
          </div>

          <!-- Seleção de Trio Ativo -->
          <div class="mb-3">
            <label class="form-label text-muted">Selecione o Trio na Pista:</label>
            <select id="select-trio-pista" class="form-select form-select-lg">
              <option value="">-- Nenhum Trio Selecionado --</option>
            </select>
          </div>

          <!-- Display Cronômetro -->
          <div class="display-cronometro mb-4" id="display-tempo">00.000</div>

          <!-- Botões de Controle do Cronômetro -->
          <div class="row g-2 mb-3">
            <div class="col-4">
              <button class="btn btn-success w-100 btn-action" id="btn-iniciar">INICIAR</button>
            </div>
            <div class="col-4">
              <button class="btn btn-warning w-100 btn-action" id="btn-parar">PARAR</button>
            </div>
            <div class="col-4">
              <button class="btn btn-secondary w-100 btn-action" id="btn-zerar">ZERAR</button>
            </div>
          </div>

          <!-- Botões de Penalidade / Resultado da Passada -->
          <div class="row g-2">
            <div class="col-4">
              <button class="btn btn-outline-warning w-100 py-3 fw-bold" id="btn-penalidade-5">+5 SEG (BARREIRA)</button>
            </div>
            <div class="col-4">
              <button class="btn btn-outline-info w-100 py-3 fw-bold" id="btn-sat">SAT (SEM TEMPO)</button>
            </div>
            <div class="col-4">
              <button class="btn btn-outline-danger w-100 py-3 fw-bold" id="btn-nulo">NULO (ZERO)</button>
            </div>
          </div>

          <div class="mt-4">
            <button class="btn btn-primary btn-lg w-100 fw-bold" id="btn-salvar-passada">SALVAR E PUBLICAR PASSADA</button>
          </div>
        </div>
      </div>

      <!-- Resumo do Trio na Pista -->
      <div class="col-lg-5">
        <div class="card card-custom p-4 h-100">
          <h4 class="text-primary mb-3">Trio na Pista</h4>
          <div id="info-trio-detalhes" class="p-3 bg-dark border border-secondary rounded">
            <p class="text-muted">Nenhum trio selecionado na pista.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, collection, doc, setDoc, updateDoc, onSnapshot, checarAutenticacao, signOut, auth, query, orderBy } from "./firebase-config.js";

    await checarAutenticacao();

    let tempoInicio = 0;
    let tempoDecorrido = 0;
    let timerInterval = null;
    let rodando = false;
    let penalidadeAdicional = 0;
    let statusResultado = "OK"; // OK, SAT, NULO

    let triosCarregados = [];
    let trioSelecionado = null;

    const display = document.getElementById("display-tempo");
    const selectTrio = document.getElementById("select-trio-pista");
    const infoTrio = document.getElementById("info-trio-detalhes");

    // Escutar Trios
    onSnapshot(query(collection(db, "trios"), orderBy("senha", "asc")), (snapshot) => {
      triosCarregados = [];
      selectTrio.innerHTML = '<option value="">-- Selecione o Trio na Pista --</option>';

      snapshot.forEach((docSnap) => {
        const item = { id: docSnap.id, ...docSnap.data() };
        triosCarregados.push(item);
        
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = `Senha #${item.senha} - ${item.lacador1} / ${item.lacador2}`;
        selectTrio.appendChild(opt);
      });
    });

    // Mudar Trio selecionado
    selectTrio.addEventListener("change", (e) => {
      const id = e.target.value;
      trioSelecionado = triosCarregados.find(t => t.id === id) || null;
      renderizarTrio();
      atualizarTelaoAoVivo();
    });

    function renderizarTrio() {
      if (!trioSelecionado) {
        infoTrio.innerHTML = '<p class="text-muted">Nenhum trio selecionado na pista.</p>';
        return;
      }

      infoTrio.innerHTML = `
        <h3 class="text-warning mb-2">Senha #${trioSelecionado.senha}</h3>
        <h5>1: ${trioSelecionado.lacador1}</h5>
        <h5>2: ${trioSelecionado.lacador2}</h5>
        ${trioSelecionado.lacador3 ? `<h5>3: ${trioSelecionado.lacador3}</h5>` : ''}
        <hr class="border-secondary">
        <p class="m-0"><strong>Soma:</strong> ${trioSelecionado.somaPontos || 0} pts</p>
      `;
    }

    // Cronômetro Logic
    function formatarTempo(ms) {
      const seg = (ms / 1000).toFixed(3);
      return seg.padStart(6, '0');
    }

    document.getElementById("btn-iniciar").addEventListener("click", () => {
      if (rodando) return;
      rodando = true;
      tempoInicio = Date.now() - tempoDecorrido;
      timerInterval = setInterval(() => {
        tempoDecorrido = Date.now() - tempoInicio;
        display.innerText = formatarTempo(tempoDecorrido + (penalidadeAdicional * 1000));
        atualizarTelaoAoVivo();
      }, 10);
    });

    document.getElementById("btn-parar").addEventListener("click", () => {
      rodando = false;
      clearInterval(timerInterval);
      atualizarTelaoAoVivo();
    });

    document.getElementById("btn-zerar").addEventListener("click", () => {
      rodando = false;
      clearInterval(timerInterval);
      tempoDecorrido = 0;
      penalidadeAdicional = 0;
      statusResultado = "OK";
      display.innerText = "00.000";
      display.style.color = "#22c55e";
      atualizarTelaoAoVivo();
    });

    // Atalhos e Penalidades
    document.getElementById("btn-penalidade-5").addEventListener("click", () => {
      penalidadeAdicional += 5;
      display.innerText = formatarTempo(tempoDecorrido + (penalidadeAdicional * 1000));
      atualizarTelaoAoVivo();
    });

    document.getElementById("btn-sat").addEventListener("click", () => {
      statusResultado = "SAT";
      display.innerText = "S.A.T";
      display.style.color = "#38bdf8";
      atualizarTelaoAoVivo();
    });

    document.getElementById("btn-nulo").addEventListener("click", () => {
      statusResultado = "NULO";
      display.innerText = "NULO";
      display.style.color = "#ef4444";
      atualizarTelaoAoVivo();
    });

    // Atualizar estado em tempo real no Firestore para o Telão / OBS
    async function atualizarTelaoAoVivo() {
      const bateria = document.getElementById("select-bateria").value;
      const docTelaoRef = doc(db, "ao_vivo", "telao_pista");

      await setDoc(docTelaoRef, {
        trio: trioSelecionado ? {
          senha: trioSelecionado.senha,
          lacador1: trioSelecionado.lacador1,
          lacador2: trioSelecionado.lacador2,
          lacador3: trioSelecionado.lacador3 || ""
        } : null,
        bateria,
        tempoTexto: display.innerText,
        statusResultado,
        rodando,
        atualizadoEm: new Date()
      });
    }

    // Salvar Passada
    document.getElementById("btn-salvar-passada").addEventListener("click", async () => {
      if (!trioSelecionado) {
        alert("Selecione um trio antes de salvar!");
        return;
      }

      const bateria = document.getElementById("select-bateria").value;
      const trioRef = doc(db, "trios", trioSelecionado.id);
      
      let tempoFinal = (tempoDecorrido / 1000) + penalidadeAdicional;
      if (statusResultado === "SAT" || statusResultado === "NULO") {
        tempoFinal = 999.999; // Valor para indicar sem tempo/nulo nas apurações
      }

      const campoTempo = `tempos.bateria_${bateria}`;
      const campoPenalidade = `penalidades.bateria_${bateria}`;
      const campoStatus = `statusPassada.bateria_${bateria}`;

      await updateDoc(trioRef, {
        [campoTempo]: tempoFinal,
        [campoPenalidade]: penalidadeAdicional,
        [campoStatus]: statusResultado
      });

      alert("Passada salva com sucesso!");
    });

    document.getElementById("btn-sair").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });
  </script>
</body>
</html>
