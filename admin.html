<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteio e Controle de Baterias - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card-box { border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); background: #fff; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="mb-0 text-dark">⚙️ Sorteio e Configuração de Pista</h3>
        <span class="text-muted small">Configure parâmetros de baterias e ordens de corrida</span>
      </div>
      <div>
        <a href="./config.html" class="btn btn-outline-secondary btn-sm me-1">Categorias</a>
        <a href="./semifinais.html" class="btn btn-outline-warning btn-sm me-1">Semifinal</a>
        <a href="./final.html" class="btn btn-outline-success btn-sm me-1">Final</a>
        <button id="btnSair" class="btn btn-danger btn-sm">Sair</button>
      </div>
    </div>

    <div class="row">
      <!-- Painel de Seleção e Configuração das Baterias -->
      <div class="col-md-5">
        <div class="card card-box p-3">
          <h5 class="card-title text-primary border-bottom pb-2">1. Seleção e Regras</h5>
          
          <div class="mb-3">
            <label for="selectCompeticao" class="form-label font-weight-bold">Competição:</label>
            <select id="selectCompeticao" class="form-select">
              <option value="">Carregando...</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="selectCategoria" class="form-label font-weight-bold">Categoria / Fase:</label>
            <select id="selectCategoria" class="form-select" disabled>
              <option value="">Selecione a competição primeiro</option>
            </select>
          </div>

          <hr>
          <h6 class="text-secondary fw-bold mb-3">🛠️ Configurações da Prova / Baterias</h6>

          <div class="mb-3">
            <label for="inputNumBaterias" class="form-label">Número de Baterias:</label>
            <input type="number" id="inputNumBaterias" class="form-control" value="1" min="1" required>
          </div>

          <div class="mb-3">
            <label for="inputCorridasPorBateria" class="form-label">Corridas Por Bateria (Lote):</label>
            <input type="number" id="inputCorridasPorBateria" class="form-control" value="25" min="1" required>
          </div>

          <div class="mb-3">
            <label for="inputClassificadosPorBateria" class="form-label">Classificados por Bateria:</label>
            <input type="number" id="inputClassificadosPorBateria" class="form-control" value="2" min="1" required>
          </div>

          <button id="btnSalvarEGerar" class="btn btn-primary w-100 py-2">
            🎲 Salvar Regras e Sortear Baterias
          </button>
        </div>
      </div>

      <!-- Resumo do Sorteio e Trios Identificados -->
      <div class="col-md-7">
        <div class="card card-box p-3">
          <h5 class="card-title text-dark border-bottom pb-2">2. Status dos Trios Cadastrados</h5>
          <div id="statusTriosContainer">
            <p class="text-muted">Selecione a categoria para listar os trios e gerar o sorteio das baterias.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, collection, getDocs, getDoc, doc, updateDoc, query, where, onAuthStateChanged, signOut } from "./firebase-config.js";

    const selectCompeticao = document.getElementById("selectCompeticao");
    const selectCategoria = document.getElementById("selectCategoria");
    const statusTriosContainer = document.getElementById("statusTriosContainer");
    const btnSalvarEGerar = document.getElementById("btnSalvarEGerar");

    let categoriasCarregadas = [];

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "./index.html";
      else carregarCompeticoes();
    });

    document.getElementById("btnSair").addEventListener("click", () => signOut(auth));

    async function carregarCompeticoes() {
      try {
        const snap = await getDocs(collection(db, "competicoes"));
        selectCompeticao.innerHTML = '<option value="">-- Selecione a Competição --</option>';
        snap.forEach(docSnap => {
          selectCompeticao.innerHTML += `<option value="${docSnap.id}">${docSnap.data().nome || docSnap.id}</option>`;
        });
      } catch (err) {
        alert("Erro ao buscar competições: " + err.message);
      }
    }

    selectCompeticao.addEventListener("change", async () => {
      const compId = selectCompeticao.value;
      selectCategoria.disabled = true;
      selectCategoria.innerHTML = '<option value="">Carregando categorias...</option>';

      if (!compId) return;

      try {
        const compDoc = await getDoc(doc(db, "competicoes", compId));
        if (compDoc.exists() && compDoc.data().categorias) {
          categoriasCarregadas = compDoc.data().categorias;
          selectCategoria.innerHTML = '<option value="">-- Selecione a Categoria --</option>';
          categoriasCarregadas.forEach(c => {
            selectCategoria.innerHTML += `<option value="${c.nome}">${c.nome} (${c.fase || 'CLASSIFICATORIA'})</option>`;
          });
          selectCategoria.disabled = false;
        } else {
          selectCategoria.innerHTML = '<option value="">Nenhuma categoria cadastrada</option>';
        }
      } catch (err) {
        alert("Erro ao buscar categorias: " + err.message);
      }
    });

    selectCategoria.addEventListener("change", async () => {
      const compId = selectCompeticao.value;
      const catNome = selectCategoria.value;

      if (!compId || !catNome) return;

      // Preenche os campos com as configurações que já existem na categoria, se houver
      const catAtual = categoriasCarregadas.find(c => c.nome === catNome);
      if (catAtual) {
        document.getElementById("inputNumBaterias").value = catAtual.numBaterias || 1;
        document.getElementById("inputCorridasPorBateria").value = catAtual.corridasPorBateria || 25;
        document.getElementById("inputClassificadosPorBateria").value = catAtual.classificadosPorBateria || 2;
      }

      statusTriosContainer.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Buscando trios inscritos...';

      try {
        const q = query(
          collection(db, "competicoes", compId, "trios"),
          where("categoria", "==", catNome)
        );
        const snap = await getDocs(q);

        if (snap.empty) {
          statusTriosContainer.innerHTML = '<div class="alert alert-warning">Nenhum trio encontrado nesta categoria.</div>';
          return;
        }

        statusTriosContainer.innerHTML = `
          <div class="alert alert-success">
            <strong>${snap.size}</strong> trios prontos para o sorteio das baterias.
          </div>
          <ul class="list-group list-group-flush small" style="max-height: 300px; overflow-y: auto;">
            ${snap.docs.map((d, i) => `<li class="list-group-list-item py-1">Senha ${d.data().senha || (i+1)} - ${d.data().integrantes ? d.data().integrantes.join(", ") : 'Trio'}</li>`).join('')}
          </ul>
        `;

      } catch (err) {
        statusTriosContainer.innerHTML = `<span class="text-danger">Erro: ${err.message}</span>`;
      }
    });

    btnSalvarEGerar.addEventListener("click", async () => {
      const compId = selectCompeticao.value;
      const catNome = selectCategoria.value;

      if (!compId || !catNome) {
        alert("Selecione a competição e a categoria!");
        return;
      }

      const numBaterias = parseInt(document.getElementById("inputNumBaterias").value) || 1;
      const corridasPorBateria = parseInt(document.getElementById("inputCorridasPorBateria").value) || 25;
      const classificadosPorBateria = parseInt(document.getElementById("inputClassificadosPorBateria").value) || 2;

      try {
        btnSalvarEGerar.disabled = true;
        btnSalvarEGerar.innerText = "Salvando e Sorteando...";

        // 1. Atualiza o Firestore com as regras definidas
        const compRef = doc(db, "competicoes", compId);
        const compSnap = await getDoc(compRef);

        if (compSnap.exists() && compSnap.data().categorias) {
          let listaCats = compSnap.data().categorias;
          const index = listaCats.findIndex(c => c.nome === catNome);

          if (index !== -1) {
            listaCats[index].numBaterias = numBaterias;
            listaCats[index].corridasPorBateria = corridasPorBateria;
            listaCats[index].classificadosPorBateria = classificadosPorBateria;

            await updateDoc(compRef, { categorias: listaCats });
          }
        }

        // 2. Executa o Sorteio das Baterias nos trios
        const q = query(
          collection(db, "competicoes", compId, "trios"),
          where("categoria", "==", catNome)
        );
        const snap = await getDocs(q);

        let triosList = [];
        snap.forEach(docSnap => {
          triosList.push({ id: docSnap.id, ...docSnap.data() });
        });

        // Embaralha trios
        triosList.sort(() => Math.random() - 0.5);

        // Distribui trios entre as baterias
        for (let i = 0; i < triosList.length; i++) {
          const bateriaPertencente = (i % numBaterias) + 1;
          const trioRef = doc(db, "competicoes", compId, "trios", triosList[i].id);
          
          await updateDoc(trioRef, {
            bateria: `Bateria ${bateriaPertencente}`,
            ordemPista: Math.floor(i / numBaterias) + 1
          });
        }

        alert(`Configurações salvas e ${triosList.length} trios distribuídos com sucesso em ${numBaterias} bateria(s)!`);

      } catch (err) {
        alert("Erro no processo de sorteio: " + err.message);
      } finally {
        btnSalvarEGerar.disabled = false;
        btnSalvarEGerar.innerText = "🎲 Salvar Regras e Sortear Baterias";
      }
    });
  </script>
</body>
</html>
