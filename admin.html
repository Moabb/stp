<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Administração</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    select, input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    .info-box { background: #e9ecef; padding: 15px; border-radius: 6px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Administração de Prova</h2>
    
    <div class="form-group">
      <label for="selectCategoria">Selecione a Categoria / Fase:</label>
      <select id="selectCategoria">
        <option value="">Carregando categorias...</option>
      </select>
    </div>

    <div class="info-box">
      <h3>Regras da Categoria Selecionada</h3>
      <p><strong>Número de Baterias:</strong> <span id="valNumBaterias">-</span></p>
      <p><strong>Limite de Gado por Bateria:</strong> <span id="valLimiteGado">-</span></p>
      <p><strong>Classificados por Bateria:</strong> <span id="valClassificados">-</span></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // INSIRA SUA CONFIGURAÇÃO DO FIREBASE AQUI
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ID da competição ativa no sistema (substitua pelo ID dinâmico da sua aplicação)
    const competicaoId = "COMPETICAO_ATIVA_ID"; 
    let competicaoAtiva = null;

    let currentNumBaterias = 1;
    let currentLimiteGado = 25;
    let currentClassificados = 5;

    // Escuta alterações na competição em tempo real
    onSnapshot(doc(db, "competicoes", competicaoId), (docSnap) => {
      if (docSnap.exists()) {
        competicaoAtiva = docSnap.data();
        atualizarSelectCategorias(competicaoAtiva.categorias || []);
      }
    });

    function atualizarSelectCategorias(categorias) {
      const select = document.getElementById("selectCategoria");
      select.innerHTML = '<option value="">-- Selecione --</option>';

      categorias.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat.nome;
        option.textContent = cat.nome;
        select.appendChild(option);
      });
    }

    document.getElementById("selectCategoria").addEventListener("change", (e) => {
      carregarDadosCategoria(e.target.value);
    });

    function carregarDadosCategoria(selectedCategoriaNome) {
      if (!competicaoAtiva || !selectedCategoriaNome) return;

      // Busca a configuração exata no array 'categorias' do documento da competição
      const categorias = competicaoAtiva.categorias || [];
      const catInfo = categorias.find(c => c.nome.trim().toLowerCase() === selectedCategoriaNome.trim().toLowerCase());

      if (catInfo) {
        currentNumBaterias = catInfo.qtdBaterias || 1;
        currentLimiteGado = catInfo.limiteGado || 25;
        currentClassificados = catInfo.classificadosPorBateria || 5;
      } else {
        // Regra genérica de fallback se a categoria não estiver cadastrada
        currentNumBaterias = competicaoAtiva.qtdBateriasFaseEspecial || 1; 
        currentLimiteGado = competicaoAtiva.limiteGadoFaseEspecial || 25;
        currentClassificados = competicaoAtiva.classificadosFaseEspecial || 5;
      }

      // Atualiza os valores exibidos na interface
      document.getElementById("valNumBaterias").innerText = currentNumBaterias;
      document.getElementById("valLimiteGado").innerText = currentLimiteGado;
      document.getElementById("valClassificados").innerText = currentClassificados;
    }
  </script>
</body>
</html>
